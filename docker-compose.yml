version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: helpdesk_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - helpdesk_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./helpdesk-system
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./helpdesk-system:/var/www
      - ./helpdesk-system/storage:/var/www/storage
    networks:
      - helpdesk_network
    command: >
      sh -c "
        sleep 5 &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    build:
      context: ./ticketing-frontend
      dockerfile: Dockerfile
    container_name: helpdesk_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - helpdesk_network

  #  ollama:
  #    image: ollama/ollama:latest
  #    container_name: helpdesk_ollama
  #    volumes:
  #      - ollama_data:/root/.ollama
  #    ports:
  #      - "11434:11434"
  #    networks:
  #      - helpdesk_network

volumes:
  mysql_data:
  ollama_data:

networks:
  helpdesk_network:
    driver: bridge
